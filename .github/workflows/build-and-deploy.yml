name: Build, push & deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  ACR_NAME: seislerduetscheswoerterbuech
  ACR_REGISTRY: seislerduetscheswoerterbuech.azurecr.io
  RESOURCE_GROUP: rg-SeislerdeutschesWoerterbuech-prod
  VM_NAME: qa
  COMPOSE_DIR: /home/azureuser/woerterbuech

jobs:
  build:
    name: Build ${{ matrix.image }}${{ github.event_name == 'pull_request' && ' (dry-run)' || ' & push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: opensearch
            dockerfile: docker/opensearch/Dockerfile
          - image: django
            dockerfile: docker/admin-app/Dockerfile
          - image: frontend
            dockerfile: docker/public-app/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # main only: authenticate so we can push
      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push'
        run: az acr login --name ${{ env.ACR_NAME }}

      # PR: dry-run build only (validates the Dockerfile, never pushes)
      - name: Build (dry-run)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ env.ACR_REGISTRY }}/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # main: build + push :latest and :<sha>
      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.ACR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to qa VM
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull new images & recreate stack on the VM
        run: |
          set -euo pipefail
          az vm run-command invoke \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "set -e; cd ${{ env.COMPOSE_DIR }}; docker compose pull; docker compose up -d --remove-orphans; docker image prune -f" \
            --query "value[0].message" -o tsv
